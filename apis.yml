description: >-
  Upwind is a cloud and AI security platform (CNAPP) that secures cloud infrastructure, workloads,
  and applications in real time — spanning cloud security posture management (CSPM), vulnerability
  management, container and Kubernetes security, API security, data security posture management
  (DSPM), identity and entitlements (CIEM), and incident response. Its Management REST API (v1 and
  v2) exposes threats, vulnerabilities, configurations, cloud accounts, inventory graph search,
  access management, and webhook integrations, secured with OAuth 2.0 client credentials and served
  from US, EU, and ME regional endpoints. Backed by Craft Ventures and Greylock.
