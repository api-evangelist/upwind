                              type: string
                              description: This property identifies the cloud platform hosting the resource, such as AWS, Azure, or Google Cloud. It helps categorize assets by their originating cloud environment.
                            cloud_resource_id:
                              type: string
                              description: A unique identifier assigned to a resource within a cloud provider's environment. It ensures each resource (such as a VM, storage bucket, or database) can be distinctly referenced, managed and tracked across services and regions.
                            launch_type:
                              type: string
                              description: This property indicates the launch type for the ECS service. It defines how tasks are hosted, such as on EC2 instances or using Fargate.
                            name:
                              type: string
                              description: This property represents the unique name assigned to the ECS service. It helps identify and manage the service within a specific ECS cluster.
                            region:
                              type: string
                              description: Indicates the Region in which this resource is located.
                            status:
                              type: string
                              description: This property indicates the current operational state of the ECS service, reflecting whether the service is actively running, updating, or encountering issues.
                            uw_protected_by:
                              type: string
                              description: Indicates whether the resource is scanned by a Sensor or a Cloud Scanner.
                            uw_risk_detections_severity_count_total:
                              type: number
