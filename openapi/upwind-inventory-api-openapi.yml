                              type: boolean
                              description: A boolean flag that determines whether the inbound NAT pool should utilize a floating public IP address. When enabled, the public IP address is not tied to a specific virtual machine, allowing for greater flexibility and resilience in scenarios involving failover or load balancing.
                            enable_tcp_reset:
