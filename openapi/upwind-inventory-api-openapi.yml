                              description: The Amazon Resource Name (ARN) uniquely identifying the DynamoDB table resource within the AWS account and region. The ARN follows the format 'arn:partition:service:region:account-id:resource-type/resource-id' and can be used for granting resource-based permissions or referencing the table programmatically.
                            billing_mode:
                              type: string
                              description: The billingMode attribute specifies the pricing model used for the DynamoDB table, determining how AWS charges for the table's provisioned throughput capacity and data storage. Possible values include on-demand or provisioned, with implications for cost optimization and performance tuning.
                            cloud_account_id:
                              type: string
