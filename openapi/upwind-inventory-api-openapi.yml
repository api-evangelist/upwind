                              type: string
                              description: A unique identifier assigned to a resource within a cloud provider's environment. It ensures each resource (such as a VM, storage bucket, or database) can be distinctly referenced, managed and tracked across services and regions.
                            deletion_protection_enabled:
                              type: boolean
                              description: The deletionProtectionEnabled attribute is a boolean flag that, when set to true, prevents the DynamoDB table from being accidentally deleted. This safeguard helps mitigate the risk of unintended data loss by requiring additional confirmation before allowing table deletion.
                            global_table_version:
                              type: string
                              description: The globalTableVersion attribute represents the version of the global table replication configuration for the specified DynamoDB table. This attribute is relevant when the table is part of a global table spanning multiple AWS regions, enabling low-latency access and disaster recovery capabilities.
                            kms_key_arn:
                              type: string
                              description: The kmsKeyArn attribute references the Amazon Resource Name (ARN) of the AWS Key Management Service (KMS) customer master key (CMK) used to encrypt the DynamoDB table data at rest. Specifying a KMS CMK enables server-side encryption and enhances data security for the table.
                            multi_region_consistency:
                              type: string
                              description: The multiRegionConsistency attribute determines whether the DynamoDB table is configured for multi-region replication, enabling low-latency read and write access across multiple AWS regions. This attribute can be set to 'ENABLED' or 'DISABLED' to control the table's replication behavior.
                            name:
                              type: string
                              description: The friendly name assigned to the Amazon DynamoDB table resource, which serves as a human-readable identifier for the table within the AWS account and region. This name must be unique across all DynamoDB tables owned by the same AWS account within the same region.
                            server_side_encryption_type:
                              type: string
                              description: Specifies the type of server-side encryption applied to the DynamoDB table data at rest. Possible values include 'AES256' for AWS-owned encryption keys, 'AWS_CLOUDHSM' for customer-managed keys stored in AWS CloudHSM, or 'KMS' for customer-managed keys stored in AWS Key Management Service (KMS).
