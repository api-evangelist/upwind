        Use this endpoint for flat searches where the filtering criteria are contained within the asset itself. This is the ideal tool for:

        - **Bulk Data Retrieval**: Generating large lists of resources across the entire environment.

        - **Attribute Filtering**: Narrowing down assets by status, type, etc.

        - **Risk Assessment**: Identifying assets based on specific vulnerability severity levels.'
