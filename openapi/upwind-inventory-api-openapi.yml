                            docker_version:
                              type: string
                              description: Specifies the version of the Docker engine installed on the Amazon ECS container instance, which is responsible for building, running, and managing Docker containers. Tracking the Docker version helps ensure compatibility and plan upgrades across the cluster.
                            name:
                              type: string
                              description: The name attribute specifies the unique identifier assigned to the Amazon ECS container instance. This value is a user-defined string that helps distinguish and manage container instances within an ECS cluster. It is recommended to use a descriptive naming convention that aligns with organizational standards.
                            overall_health_status:
                              type: string
                              description: Indicates the current operational status of the Amazon ECS container instance based on system health checks and metrics. Possible values include HEALTHY, UNHEALTHY, UNKNOWN, and IMPAIRED. This attribute helps identify potential issues impacting container deployments and aids in capacity planning within the cluster.
                            region:
                              type: string
                              description: Indicates the Region in which this resource is located.
                            status:
                              type: string
                              description: The status attribute represents the current lifecycle state of the Amazon ECS container instance. Possible values include ACTIVE, DRAINING, and REGISTERING. This attribute provides visibility into the operational readiness of the instance to accept and run new tasks or to be decommissioned for updates or maintenance.
                            status_reason:
                              type: string
                              description: Provides a human-readable explanation for the current status of the Amazon ECS container instance, such as why it is in a pending, draining, or deregistered state. This contextual information aids in troubleshooting and understanding instance lifecycle events.
