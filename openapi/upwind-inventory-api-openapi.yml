  /v2/organizations/{organization-id}/inventory/catalog/assets/{id}:
    get:
      operationId: getAsset
      summary: Get an asset
      description: A `GET` request sent to the endpoint root followed by a unique identifier returns detailed information about a specific asset.
      tags:
      - Inventory
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: Upwind asset ID
        example: uwr-b7d8d158c28ab7ca281fd424311e9d19
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Successful API response containing items
                properties:
                  items:
                    type: array
                    description: The list of items in the response
                    items:
                      type: object
                      description: Detailed asset document with its raw data
                      properties:
                        id:
                          type: string
                          description: Upwind asset ID
                        raw_data:
                          description: The asset's data as provided by its source provider. Structure varies by asset type.
                        resource_type:
                          type: string
                          description: Resource type (e.g. aws_ec2_instance)
                      title: ApiCatalogAssetDetailResponse
                title: RestApiResponseApiCatalogAssetDetailResponse
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Rate Limit Exceeded
      security:
      - OAuth2ClientCredentials: []
  /v2/organizations/{organization-id}/inventory/schema/{label-name}:
    get:
      operationId: getSchemaByLabelName
      summary: Get asset schema
      description: Retrieves the schema for a specific asset label containing its searchable fields with their types. Use this endpoint to discover the queryable attributes for a specific asset label.
      tags:
      - Inventory
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The name of the asset label to retrieve
        example: '`aws_ec2_instance`'
        in: path
        name: label-name
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Response containing inventory schema assets
                example:
                  items:
                  - label: aws_ec2_instance
                    schema:
                      fields:
                      - name: cloud_account_id
                        type: String
                      - name: clusters
                        type: aws_eks_cluster
                properties:
                  items:
                    type: array
                    description: List of inventory schema assets
                    items:
                      type: object
                      description: An asset label in the inventory schema
                      properties:
                        fields:
                          type: array
                          description: 'List of fields for this asset label.<br><br> <b>Primitive</b> types: String, Numeric, Date, Boolean<br><b>Complex</b> types: any asset label'
                          example:
                          - name: cloud_account_id
                            type: String
                          - name: clusters
                            type: aws_eks_cluster
                          items:
                            type: object
                            description: A field in an inventory asset schema
                            properties:
                              name:
                                type: string
                                description: The name of the field, or the label name of another asset for nested queries.
                                example: cloud_account_id
                              type:
                                type: string
                                description: The data type of the field, or the asset label for nested query conditions.
                                example: String
                            title: ApiInventorySchemaField
