  /v1/organizations/{organization-id}/apisecurity-endpoints:
    get:
      operationId: getApiCatalog
      summary: List endpoints
      description: A `GET` request sent to the endpoint root returns a list of API Endpoint objects that
        are associated with the specified organization. To learn more about API Security, refer to the
        [API Security Overview](/api-security/overview) page.
      tags:
      - api-security
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: Specifies how many results are returned on a page.
        in: query
        name: per-page
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - description: Specifies the token for fetching subsequent pages in a paginated result set. Use
          the token from a previous response to continue retrieving data when the number of results exceeds
          the current page size.
        in: query
        name: page-token
        required: false
        schema:
          type: string
      - description: Filters endpoints by HTTP method (GET, POST, PUT, DELETE, etc.).
        in: query
        name: method
        required: false
        schema:
          type: string
      - description: Filters endpoints by authentication state. Multiple values may be provided, separated
          by commas.
        example: AUTHENTICATED,UNAUTHENTICATED
        in: query
        name: authentication-state
        required: false
        schema:
          type: string
          enum:
          - AUTHENTICATED
          - UNAUTHENTICATED
          - UNKNOWN
      - description: Filters endpoints that have internet ingress exposure.
        in: query
        name: has-internet-ingress
        required: false
        schema:
          type: boolean
      - description: Filters endpoints that have associated vulnerabilities.
        in: query
        name: has-vulnerability
        required: false
        schema:
          type: boolean
      - description: Filters endpoints that handle sensitive data.
        in: query
        name: has-sensitive-data
        required: false
        schema:
          type: boolean
      - description: Filters by the specified cloud account ID.
        in: query
        name: cloud-account-id
        required: false
        schema:
          type: string
      - description: Filters endpoints by cloud provider (AWS, Azure, GCP, etc.).
