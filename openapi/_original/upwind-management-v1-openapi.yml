  /v1/organizations/{organization-id}/vulnerability-findings:
    get:
      operationId: getVulnerabilityFindingList
      summary: List findings
      description: A `GET` request sent to the endpoint root returns a list of Vulnerability finding objects
        that are associated with the specified organization. To learn more about Vulnerabilities, refer
        to the [Vulnerabilities Overview](/vulnerabilities/overview) page.
      tags:
      - vulnerabilities
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: Specifies how many results are returned on a page.
        in: query
        name: per-page
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - description: Filters by the specified cloud account ID.
        in: query
        name: cloud-account-id
        required: false
        schema:
          type: string
      - description: Filters findings for packages currently in use.
        in: query
        name: package-in-use
        required: false
        schema:
          type: boolean
      - description: Filters findings for vulnerabilities with exploitable functions currently in use.
        in: query
        name: has-exploitable-functions-in-use
        required: false
        schema:
          type: boolean
      - description: Filters findings for packages with a known exploit.
        in: query
        name: exploitable
        required: false
        schema:
          type: boolean
      - description: Filters findings for packages with an available fix.
        in: query
        name: fix-available
        required: false
        schema:
          type: boolean
      - description: Filters findings for resources with active internet ingress communication.
        in: query
        name: ingress-active-communication
        required: false
        schema:
          type: boolean
      - description: Filters findings for resources with internet exposure.
        in: query
        name: internet-exposure
        required: false
        schema:
          type: boolean
      - description: Filters by the level of CVSS severity.
        in: query
        name: severity
        required: false
        schema:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          - unclassified
          - other
      - description: Filters by the level of EPSS severity.
        in: query
        name: epss-severity
        required: false
        schema:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          - critical
          - unclassified
      - description: Filters findings by the specified CVE ID.
        in: query
        name: cve-id
        required: false
        schema:
          type: string
      - description: Filters by the specified Kubernetes namespace.
        in: query
        name: namespace
        required: false
        schema:
          type: string
      - description: Specifies the token for fetching subsequent pages in a paginated result set. Use
          the token from a previous response to continue retrieving data when the number of results exceeds
          the current page size.
        in: query
        name: page-token
        required: false
        schema:
          type: string
      - description: Filters findings by the specified image name. For example, `nginx:latest` or `myapp:1.2`.
        in: query
        name: image-name
        required: false
        schema:
          type: string
      - description: Filters findings by the specified Upwind asset ID.
        in: query
        name: upwind-asset-id
        required: false
        schema:
          type: string
      - description: Filters findings by the vendor catalog that flags the CVE as a known exploit (e.g.
          `cisa`, `nist`). Comma-separated; matches findings flagged by any of the listed vendors. Values
          are forwarded to the vulnerability service; new vendor catalogs supported upstream become available
          here automatically.
        in: query
        name: known-exploit-sources
        required: false
        schema:
          type: string
      - description: 'Filters findings by the resource type of the affected asset. Comma-separated; matches
          findings on any of the listed resource types. Example: `AwsInstance,AwsLambdaFunction,Deployment`.'
        in: query
        name: resource-type
        required: false
        schema:
          type: string
      - description: 'Filters findings by resource tags in `key:value` form. Repeat the parameter to filter
          on multiple tags; matches findings whose resource carries any of the listed tags. Example: `?resource-tags=env:prod&resource-tags=team:security`.
          Tag values may contain commas.'
        in: query
        name: resource-tags
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
