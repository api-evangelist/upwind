  /v1/organizations/{organization-id}/threat-policies:
    get:
      operationId: list-threat-policies
      summary: List policies
      description: A `GET` request sent to the endpoint root returns a list of Threat Policy objects that
        are associated with the specified organization. To learn more about Threat Policies, refer to
        the [Policies Overview](/threats/policies/overview) page.
      tags:
      - threats
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: Filters the policy list to include only policies managed by the specified entity.
        in: query
        name: managed-by
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: The category of this policy.
                      enum:
                      - PROCESS_EXECUTION
                    display_name:
                      type: string
                      description: The display name for this policy.
                    enabled:
                      type: boolean
                      description: Indicates whether this policy is currently enabled.
                    id:
                      type: string
                      description: The unique identifier for this policy.
                    managed_by:
                      type: string
                      description: The entity responsible for managing this policy.
                      enum:
                      - UPWIND
                    open_issues:
                      type: integer
                      format: int32
                      description: The number of open issues associated with this policy.
                    scope:
                      type: string
                      description: Specifies whether the policy applies to all resources or a subset.
                      enum:
                      - ALL_RESOURCES
                      - SUBSET
                    severity:
                      type: string
                      description: The severity level of a threat as assessed by this policy.
                      enum:
                      - LOW
                      - MEDIUM
                      - HIGH
                      - CRITICAL
                  title: ThreatPolicy
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Rate Limit Exceeded
      security:
      - OAuth2ClientCredentials: []
  /v1/organizations/{organization-id}/events/shift-left/search:
    post:
      operationId: searchShiftLeftEvents
      summary: Search ShiftLeft events
      description: A `POST` request sent to the endpoint searches for ShiftLeft Events between the start_time
        and end_time.
      tags:
      - events
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for searching shift-left events
              properties:
                end_time:
                  type: integer
                  format: int64
                  description: End of the time range filter as Unix timestamp in milliseconds.
                start_time:
                  type: integer
                  format: int64
                  description: Start of the time range filter as Unix timestamp in milliseconds.
              title: ShiftLeftListEventSearchRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: ShiftLeft Events
                    items:
                      type: object
                      properties:
                        architecture:
                          type: string
                        branch:
                          type: string
                        commit_sha:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        fingerprint:
                          type: string
                        image:
                          type: string
                        image_sha:
                          type: string
                        image_size:
                          type: integer
                          format: int64
                        initiator:
                          type: string
                        os:
                          type: string
                        repository:
                          type: string
                        repository_scan_details:
                          type: object
                          properties:
                            main_branch_name:
                              type: string
                            pr_id:
                              type: string
                            pr_link:
                              type: string
                          title: ShiftLeftRepositoryEventData
                        source:
                          type: string
                        type:
                          type: string
                        updatedAt:
                          type: string
                          format: date-time
                        variant:
                          type: string
                      title: ShiftLeftEventData
                  metadata:
                    description: Pagination metadata
                    type: object
                    properties:
                      limit:
                        type: integer
                        format: int32
                        description: The maximum number of items returned per page
                        example: 20
                      next_cursor:
                        type: string
                        description: Cursor for fetching the next page of results. Absent if there are
                          no more pages.
                        example: eyJvZmZzZXQiOjIwfQ
                      previous_cursor:
                        type: string
                        description: Cursor for fetching the previous page of results. Absent if this
                          is the first page.
                        example: eyJvZmZzZXQiOjB9
                    title: ApiPaginationMetadata
                title: ShiftLeftSearchEventsData
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Rate Limit Exceeded
      security:
      - OAuth2ClientCredentials: []
  /v1/organizations/{organization-id}/threat-policies/{policy-id}:
    patch:
      operationId: updateThreatPolicy
      summary: Update a policy
      description: A `PATCH` request sent to the endpoint root followed by a unique identifier allows
        for updating specific fields of an existing Threat Policy. This endpoint facilitates the modification
        of attributes such the enablement status. To modify a Threat Policy, provide the necessary changes
        in the request body. To learn more about Threat Policies, refer to the [Policies Overview](/threats/policies/overview)
        page.
      tags:
      - threats
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for this policy.
        in: path
        name: policy-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Indicates whether this policy should be enabled.
              title: ThreatPolicyUpdateRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: string
                    description: The category of this policy.
                    enum:
                    - PROCESS_EXECUTION
                  display_name:
                    type: string
                    description: The display name for this policy.
                  enabled:
                    type: boolean
                    description: Indicates whether this policy is currently enabled.
                  id:
                    type: string
                    description: The unique identifier for this policy.
                  managed_by:
                    type: string
                    description: The entity responsible for managing this policy.
                    enum:
                    - UPWIND
                  open_issues:
                    type: integer
                    format: int32
                    description: The number of open issues associated with this policy.
                  scope:
                    type: string
                    description: Specifies whether the policy applies to all resources or a subset.
                    enum:
                    - ALL_RESOURCES
                    - SUBSET
                  severity:
                    type: string
                    description: The severity level of a threat as assessed by this policy.
                    enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                    - CRITICAL
                title: ThreatPolicy
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Rate Limit Exceeded
      security:
      - OAuth2ClientCredentials: []
components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
