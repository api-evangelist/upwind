  /v1/organizations/{organization-id}/configuration-findings/{finding-id}:
    get:
      operationId: getComplianceResourceFindingById
      summary: Get a finding
      description: A `GET` request sent to the endpoint root followed by a unique identifier returns detailed
        information about a specific Configuration Finding. This endpoint provides access to comprehensive
        details such as the status, severity, framework information, and the associated resource. To learn
        more about Configuration Findings, refer to the [Configurations Overview](/configurations/overview)
        page.
      tags:
      - configurations
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for this configuration finding.
        in: path
        name: finding-id
        required: true
        schema:
          type: string
      - description: Specifies whether to include cloud account tags in the response.
        in: query
        name: include-cloud-account-tags
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  check:
                    description: The configuration check that generated this finding.
                    type: object
                    properties:
                      description:
                        type: string
                        description: The description of this configuration check.
                      id:
                        type: string
                        description: The unique identifier for this configuration check.
                      remediation:
                        type: string
                        description: The remediation guidance for this configuration check.
                      title:
                        type: string
                        description: The title of this configuration check.
                    title: ConfigurationCheck
                  description:
                    type: string
                    description: The description of this finding.
                  first_seen_time:
                    type: string
                    format: date-time
                    description: The timestamp when this finding was first seen.
                  framework:
                    description: The configuration framework associated with this finding.
                    type: object
                    properties:
                      cloud_provider:
                        type: string
                        description: The cloud provider this framework is associated with.
                      description:
                        type: string
                        description: A detailed description of the framework.
                      id:
                        type: string
                        description: The unique identifier for this configuration framework.
                      revision:
                        type: string
                        description: The revision of this configuration framework.
                      status:
                        type: string
                        description: The current status of the framework.
                        enum:
                        - ENABLED
                        - DISABLED
                      title:
                        type: string
                        description: The title of this configuration framework.
                      version:
                        type: string
                        description: The version of this configuration framework.
                    title: ConfigurationFramework
                  id:
                    type: string
                    description: The unique identifier for this finding.
                  last_seen_time:
                    type: string
                    format: date-time
                    description: The timestamp when this finding was last seen.
                  last_sync_time:
                    type: string
                    format: date-time
                    description: The timestamp when this finding was last synchronized.
                  resource:
                    description: The resource associated with this finding.
                    type: object
                    properties:
                      arn:
                        type: string
                        description: The Amazon Resource Name (ARN) for AWS resources. Absent for non-AWS
                          or unsupported resource types.
                      cloud_account_id:
                        type: string
                        description: The unique identifier for the cloud account associated with this
                          resource.
                      cloud_account_name:
                        type: string
                        description: The name of the cloud account associated with this resource.
                      cloud_account_tags:
                        type: array
                        description: List of tags associated with the cloud account the resource belongs
                          to.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                          title: Tag
                      cloud_provider:
                        type: string
                        description: The cloud provider of this resource.
                        enum:
                        - AWS
                        - GCP
                        - AZURE
                        - ORACLE
                        - BYOC
                      cluster_id:
                        type: string
                        description: The unique identifier for the cluster associated with this resource.
                      id:
                        type: string
                        description: The unique identifier for this resource.
                      name:
                        type: string
                        description: The name of this resource.
                      namespace:
                        type: string
                      region:
                        type: string
                        description: The region where this resource is located.
                      risk_categories:
                        type: array
                        items:
                          type: string
                        uniqueItems: true
                      type:
                        type: string
                        description: The type of this resource.
                      upwind_asset_id:
                        type: string
                        description: The Upwind asset ID for this resource.
                    title: ComplianceResource
                  severity:
                    type: string
                    description: The severity level of this finding.
                    enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                    - CRITICAL
                  status:
                    type: string
                    description: The status of this finding.
                    enum:
                    - PASS
                    - FAIL
                    - ALL
                  title:
                    type: string
                    description: The title of this finding.
                title: ConfigurationFinding
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Rate Limit Exceeded
      security:
      - OAuth2ClientCredentials: []
