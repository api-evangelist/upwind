  /v1/organizations/{organization-id}/vulnerability-findings/{finding-id}:
    get:
      operationId: get-vulnerability-finding-by-id
      summary: Get a finding
      description: A `GET` request sent to the endpoint root followed by a unique identifier returns detailed
        information about a specific Vulnerability finding. This endpoint gives access to comprehensive
        details such as the CVE ID (Common Vulnerabilities and Exposures Identifier), the affected resource,
        severity, status, and runtime contextual information. To learn more about Vulnerabilities, refer
        to the [Vulnerabilities Overview](/vulnerabilities/overview) page.
      tags:
      - vulnerabilities
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for this finding.
        in: path
        name: finding-id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_seen_time:
                    type: string
                    format: date-time
                    description: The timestamp when this finding was first seen.
                  id:
                    type: string
                    description: The unique identifier for this finding.
                  image:
                    description: The information on the vulnerable image identified by this finding.
                    type: object
                    properties:
                      digest:
                        type: string
                        description: The sha256 digest of the image manifest.
                      name:
                        type: string
                        description: The name of this image.
                      os_name:
                        type: string
                        description: The name of the operating system associated with this image.
                      os_version:
                        type: string
                        description: The version of the operating system associated with this image.
                      tag:
                        type: string
                        description: The tag associated with this image.
                      uri:
                        type: string
                        description: The URI of this image.
                    title: Image
                  last_scan_time:
                    type: string
                    format: date-time
                    description: The timestamp when this finding was last scanned.
                  package:
                    description: The information on the vulnerable package identified by this finding.
                    type: object
                    properties:
                      framework:
                        type: string
                        description: The framework associated with this package.
                      in_use:
                        type: boolean
                        description: An indicator signaling if this package is currently being utilized
                          by the resource.
                      introduced_by_layers:
                        type: array
                        description: For image findings, the list of layers that introduced this package.
                        items:
                          type: object
                          properties:
                            layer_index:
                              type: integer
                              format: int32
                              description: The index of the layer within the image.
                            layer_sha:
                              type: string
                              description: The SHA digest of the layer.
                          title: ApiLayerInfo
                      name:
                        type: string
                        description: The name of this package.
                      type:
                        type: string
                        description: The type of this package.
                      version:
                        type: string
                        description: The version of this package.
                    title: Package
                  remediation:
                    type: array
                    items:
                      oneOf:
                      - allOf:
                        - type: object
                          description: Base schema for remediation strategies
                          discriminator:
                            mapping:
                              OFFICIAL_FIX: circular(OfficialFix)
                            propertyName: type
                          properties:
                            type:
                              type: string
                              description: The type of the remediation strategy.
                              enum:
                              - OFFICIAL_FIX
                          title: RemediationItem
                        - type: object
                          properties:
                            data:
                              description: The data of the remediation strategy.
                              type: object
                              properties:
                                fixed_in_version:
                                  type: string
                              title: OfficialFixData
                        title: OfficialFix
                  resource:
                    description: The information on the vulnerable resource identified by this finding.
                    type: object
                    properties:
                      cloud_account_id:
                        type: string
                        description: The unique identifier for the cloud account associated with this
                          resource.
                      cloud_account_name:
                        type: string
                        description: The name of the cloud account associated with this resource.
                      cloud_account_tags:
                        type: array
                        description: List of tags associated with the cloud account the resource belongs
                          to.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                          title: Tag
                      cloud_organization_id:
                        type: string
                        description: The unique identifier for the cloud organization that the cloud account
                          belongs to.
                      cloud_organization_unit_id:
                        type: string
                        description: The unique identifier for the cloud organizational unit that the
                          cloud account belongs to.
                      cloud_provider:
                        type: string
                        description: The cloud provider of this resource.
                        enum:
                        - AWS
                        - GCP
                        - AZURE
                      cluster_id:
                        type: string
                        description: The unique identifier for the cluster associated with this resource.
                      cluster_name:
                        type: string
                        description: The name of the cluster associated with this resource.
                      external_id:
                        type: string
                        description: The external unique identifier for this resource.
                      id:
                        type: string
                        description: The unique identifier for this resource.
                      internet_exposure:
                        type: object
                        properties:
                          ingress:
                            description: The information about incoming internet-facing communication
                              activities of the resource.
                            type: object
                            properties:
                              active_communication:
                                type: boolean
                                description: An indicator signaling whether there is active incoming communication
                                  from the internet to the resource.
                            title: InternetExposureDetails
                        title: InternetExposure
                      name:
                        type: string
                        description: The name of this resource.
                      namespace:
                        type: string
                      region:
                        type: string
                        description: The region where this resource is located.
                      resource_tags:
                        type: array
                        description: List of tags on the resource itself (distinct from cloud_account_tags).
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                          title: Tag
                      risk_categories:
                        type: array
                        items:
                          type: string
                        uniqueItems: true
                      type:
                        type: string
                        description: The type of this resource.
                      upwind_asset_id:
                        type: string
                        description: The Upwind asset identifier for this resource.
                    title: VulnerabilityResource
                  source:
                    type: string
                    description: The source of this finding.
                    enum:
                    - SENSOR
                    - CLOUD_SCANNER
                  status:
                    type: string
                    description: The status of this finding.
                    enum:
                    - OPEN
                    - ARCHIVED
                  vulnerability:
                    description: The information on the Common Vulnerabilities and Exposures (CVE) identified
                      by this finding.
                    type: object
                    properties:
                      cve_first_seen_time:
                        type: string
                        format: date-time
                        description: The timestamp when this CVE was first seen.
                      description:
                        type: string
                        description: The brief description assigned to this vulnerability by Upwind.
                      epss_score:
                        type: string
                        description: The score of this vulnerability based on the Exploit Prediction Scoring
                          System (EPSS). Scores range from 0.0 to 1.0, with higher values indicating a
                          higher likelihood of exploitation.
                      epss_severity:
                        type: string
                        description: The severity level of this vulnerability based on the Exploit Prediction
                          Scoring System (EPSS).
                      exploitable:
                        type: boolean
                        description: An indicator signaling if this vulnerability has a known exploit.
                      exploitable_functions_in_use:
                        type: array
                        description: List of exploitable functions currently in use for this vulnerability.
                        items:
                          type: object
                          properties:
                            container_id:
                              type: string
                              description: The identifier of the container in which the exploitable function
                                is running.
                            container_name:
                              type: string
                              description: The name of the container in which the exploitable function
                                is running.
                            file_path:
                              type: string
                              description: The file path where the exploitable function is located.
                            function_name:
                              type: string
                              description: The name of the exploitable function.
                            last_detection_time:
                              type: string
                              format: date-time
                              description: The timestamp when this exploitable function was last detected
                                in use (in ISO8601 format).
                            origin_library_id:
                              type: string
                              description: The identifier of the library where this in-use function was
                                detected.
                              example: com.example.security:crypto-utils
                            process_id:
                              type: string
                              description: The identifier of the process executing the exploitable function.
                            process_name:
                              type: string
                              description: The name of the process executing the exploitable function.
                          title: ApiExploitableFunctionInUse
                      known_exploit_sources:
                        type: array
                        description: List of vendor catalog identifiers (e.g. `cisa`, `nist`) that flag
                          this CVE as a known exploit.
                        example:
                        - cisa
                        - nist
                        items:
                          type: string
                      name:
                        type: string
                        description: The identification name assigned to this vulnerability by Upwind.
                      nvd_cve_id:
                        type: string
