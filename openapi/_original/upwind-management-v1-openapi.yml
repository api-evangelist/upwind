        associated with the specified organization. This action permanently removes the rule and cannot
        be undone. To learn more about Configuration Rules, refer to the [Configuration Rules](/configurations/custom-configuration-rules)
        page.
      tags:
      - configurations
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for the configuration rule.
        in: path
        name: rule-id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Rate Limit Exceeded
      security:
      - OAuth2ClientCredentials: []
    patch:
      operationId: editCustomRule
      summary: Update a rule
      description: A `PATCH` request sent to the endpoint allows you to update an existing Configuration
        Rule object that is associated with the specified organization. You can modify properties such
        as name, category, severity, and Rego policy. To learn more about Configuration Rules, refer to
        the [Configuration Rules](/configurations/custom-configuration-rules) page.
      tags:
      - configurations
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for the configuration rule.
        in: path
        name: rule-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_kind:
                  type: string
                  description: Primary resource type to evaluate
                category:
                  type: string
                  description: Category for the rule.
                description:
                  type: string
                  description: Short description of the rule.
                name:
                  type: string
                  description: Display name for the rule
                rego_policy:
                  type: string
                  description: Rego policy for the rule.
                  maxLength: 50000
                  minLength: 0
                risk_category:
                  type: string
                  description: Risk category for the rule.
                severity:
                  type: string
                  description: Severity for the rule.
                  enum:
                  - CRITICAL
                  - HIGH
                  - MEDIUM
                  - LOW
              title: CustomRuleEditRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Response schema for creating a configuration rule
                properties:
                  category:
                    type: string
                    description: The category of this configuration rule.
                  create_time:
                    type: string
                    format: date-time
                    description: The timestamp when this configuration rule was created.
                  description:
                    type: string
                    description: The description of this configuration rule.
                  frameworks:
                    type: array
                    description: The frameworks associated with this configuration rule.
                    items:
                      type: object
                      properties:
                        cloud_provider:
                          type: string
                          description: The cloud provider this framework is associated with.
                        description:
                          type: string
                          description: A detailed description of the framework.
                        id:
                          type: string
