  /v1/organizations/{organization-id}/cloud-accounts/{account-id}:
    delete:
      operationId: deleteCloudAccount
      summary: Delete a cloud account
      description: A `DELETE` request sent to the endpoint removes a Cloud Account object that is associated
        with the specified organization. This action permanently removes the cloud account and all associated
        data. To learn more about Cloud Accounts, refer to the [Connect Cloud Account Overview](/getting-started/connect-cloud-account/overview)
        page.
      tags:
      - cloud-accounts
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for the cloud account.
        in: path
        name: account-id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Rate Limit Exceeded
        '500':
          description: Internal Server Error
      security:
      - OAuth2ClientCredentials: []
    patch:
      operationId: updateCloudAccount
      summary: Update a cloud account
      description: A `PATCH` request sent to the endpoint updates an existing Cloud Account object that
        is associated with the specified organization. This endpoint allows you to modify the configuration
        of an existing cloud account. To learn more about Cloud Accounts, refer to the [Connect Cloud
        Account Overview](/getting-started/connect-cloud-account/overview) page.
      tags:
      - cloud-accounts
      parameters:
      - description: The unique identifier for the Upwind organization.
