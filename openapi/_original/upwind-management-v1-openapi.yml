  /v1/organizations/{organization-id}/sbom-packages:
    get:
      operationId: listSbomPackages
      summary: List SBOM packages
      description: A `GET` request sent to the endpoint root returns a list of Software Bill of Materials
        (SBOM) packages associated with the specified organization. This endpoint provides comprehensive
        details about packages including their vulnerabilities, affected resources, and usage statistics.
        The results can be filtered by various criteria including package name, version, framework, and
        more.
      tags:
      - packages
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
