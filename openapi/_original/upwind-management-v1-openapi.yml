    patch:
      operationId: update-threat-detection
      summary: Update a detection
      description: A `PATCH` request sent to the endpoint root followed by a unique identifier allows
        for updating specific fields of an existing Threat Detection. This endpoint facilitates the modification
        of attributes such the detection status. To modify a Threat Detection, provide the necessary changes
        in the request body. To learn more about Threat Detections, refer to the [Detections Overview](/threats/detections/overview)
        page.
      tags:
      - threats
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      - description: The unique identifier for this detection.
        in: path
        name: detection-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: The status for this detection.
                  enum:
                  - ARCHIVED
              title: UpdateDetectionRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: string
                    description: The category of this detection.
                    enum:
                    - NETWORK
                    - PROCESS
                    - CLOUD_LOGS
                  description:
                    type: string
                    description: A detailed description of this detection.
                  first_seen_time:
                    type: string
                    format: date-time
                    description: The timestamp when this detection was first seen.
                  id:
                    type: string
                    description: The unique identifier for this detection.
                  last_seen_time:
                    type: string
                    format: date-time
                    description: The timestamp when this detection was last seen.
                  mitre_attacks:
                    type: array
                    description: The MITRE ATT&CK framework information related to this detection.
                    items:
                      type: object
