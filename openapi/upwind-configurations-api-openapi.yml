  /v2/organizations/{organization-id}/configurations/custom-rules:
    post:
      operationId: createRule
      summary: Create a configuration rule
      description: A `POST` request sent to this endpoint creates a configuration rule. Configuration rules define custom compliance checks using Rego policy language to evaluate cloud resources against security and governance requirements.
      tags:
      - configurations
      parameters:
      - description: The unique identifier for the Upwind organization.
        example: org_Xk9mPq7RtYwN2vLs
        in: path
        name: organization-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for creating a configuration rule.
              properties:
                asset_kind:
                  type: string
                  description: The primary resource type to evaluate.
                  example: aws_s3_bucket
                  minLength: 1
                category:
                  type: string
                  description: The category for the configuration rule.
                description:
                  type: string
                  description: A short description of the configuration rule.
                framework_id:
                  type: string
                  description: The framework this rule is associated with.
                rego_policy:
                  type: string
                  description: The Rego policy logic for the configuration rule.
                  example: '`is_pass(input_item) := false { input_item.public_access == true } else := true`'
