  /v1/organizations/{organization-id}/configuration-findings/{finding-id}:
    get:
      operationId: getComplianceResourceFindingById
      summary: Get a finding
      description: A `GET` request sent to the endpoint root followed by a unique identifier returns detailed information about a specific Configuration Finding. This endpoint provides access to comprehensive details such as the status, severity, framework information, and the associated resource. To learn more about Configuration Findings, refer to the [Configurations Overview](/configurations/overview) page.
