                  detailMessageCode:
                    type: string
                  headers:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    properties:
                      accept:
                        type: array
                        items:
                          type: object
                          properties:
                            charset:
                              type: string
                            concrete:
                              type: boolean
                            parameters:
                              type: object
                              additionalProperties:
                                type: string
                            qualityValue:
                              type: number
                              format: double
                            subtype:
                              type: string
                            subtypeSuffix:
                              type: string
                            type:
                              type: string
                            wildcardSubtype:
                              type: boolean
                            wildcardType:
                              type: boolean
                          title: MediaType
                      acceptCharset:
                        type: array
                        items:
                          type: string
                      acceptLanguage:
                        type: array
                        items:
                          type: object
                          properties:
                            range:
                              type: string
                            weight:
                              type: number
                              format: double
                      acceptLanguageAsLocales:
                        type: array
                        items:
                          type: string
                      acceptPatch:
                        type: array
                        items:
                          type: object
                          properties:
                            charset:
                              type: string
                            concrete:
                              type: boolean
                            parameters:
                              type: object
